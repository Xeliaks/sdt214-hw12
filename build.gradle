plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9' // API page at /swagger-ui.html
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Two classes have main(): the service and the Swing client.
springBoot { mainClass = 'pointbuy.PointBuyApplication' }

tasks.named('test') { useJUnitPlatform() }

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Starts the Swing GUI client (start the service first with bootRun).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'pointbuy.PointBuyClient'
}
